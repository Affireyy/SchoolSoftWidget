name: SchoolSoftWidget
options:
  bundleIdPrefix: com.dessimondi
  deploymentTarget:
    macOS: "14.0"
  # Xcode 26 treats an Icon Composer .icon package as one opaque file, but
  # XcodeGen's default folder scan would otherwise explode it into its
  # individual contents (icon.json, the SVG assets, etc). This keeps it
  # as a single "SchoolSoftWidget.icon in Resources" reference, matching Xcode.
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "1.0.4"
    INFOPLIST_KEY_CFBundleVersion: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UDWA7LNKRM

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  SchoolSoftWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: SchoolSoftWidgetExtension
        codeSign: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dessimondi.SchoolSoftWidget
        CODE_SIGN_ENTITLEMENTS: App/SchoolSoftWidget.entitlements
        INFOPLIST_FILE: App/Info.plist
        # Matches the Icon Composer file's name (App/SchoolSoftWidget.icon,
        # minus the extension) -- this is the "App Icon Set Name" field
        # you'd see in Xcode's own build settings UI.
        ASSETCATALOG_COMPILER_APPICON_NAME: SchoolSoftWidget
    # IMPORTANT: this app's Info.plist needs custom, non-Apple keys (Sparkle's
    # SUFeedURL etc). Xcode's GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_<X>
    # build-setting mechanism ONLY synthesizes keys from Apple's own known
    # Info.plist key catalog -- unrecognized third-party keys like Sparkle's
    # are silently dropped with no error, which is why auto-update never
    # actually worked in any shipped release. XcodeGen's `info:` block avoids
    # that entirely by writing a real, literal Info.plist file at generate
    # time with exactly these keys, standard ones included.
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.education
        # Sparkle auto-update feed + the public half of the EdDSA signing
        # key. The matching private key never lives in this repo -- CI
        # reads it from the SPARKLE_PRIVATE_KEY secret at release time.
        SUFeedURL: https://raw.githubusercontent.com/Affireyy/SchoolSoftWidget/main/appcast.xml
        SUPublicEDKey: "J1x8Iu8W4VLz4Dt8LBfB5lj230F7kW81zB9UWJz2BiY="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: App/SchoolSoftWidget.entitlements
      properties:
        # App Sandbox is intentionally OFF for the main app so Sparkle can
        # install downloaded updates directly, with no installer XPC
        # service to maintain. The widget extension below stays sandboxed
        # -- WidgetKit requires that regardless.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true

  SchoolSoftWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dessimondi.SchoolSoftWidget.extension
        CODE_SIGN_ENTITLEMENTS: Widget/SchoolSoftWidgetExtension.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SchoolSoft Schedule
    entitlements:
      path: Widget/SchoolSoftWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # App Groups would normally be used here so the widget can read
        # the app's cached schedule data, but that capability requires a
        # real, Apple-issued Team ID (a paid Apple Developer Program
        # membership) to function for anyone other than the machine it
        # was built on. This project ships ad-hoc signed with no team, so
        # instead the widget gets read-only sandbox access to exactly the
        # one file the app writes its cache to -- a local rule macOS
        # enforces itself, independent of code-signing team. See
        # Shared/ScheduleCache.swift.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/SchoolSoftWidget/

